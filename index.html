<title>팜넷 재고·유통 관리 시스템</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 참고 사이트와 같은 한 단 구조. 헤더(로고·연결 상태) → 상단 탭 → 섹션별 카드. 표는 가로 스크롤 영역 안에서만 넓어진다. */
:root{
  --bg:#f2f5f8; --surface:#ffffff; --surface2:#f7f9fb; --ink:#14202e; --ink2:#46566a; --muted:#6f7f90;
  --line:#dce3ea; --line2:#e9eef3; --brand:#1f4e78; --brand-ink:#ffffff; --brand-soft:#e3edf6;
  --focus:#2a78d6; --s1:#2a78d6; --s2:#eb6834; --total:#14202e;
  --ok-bg:#e2f0d9; --ok-fg:#2f5a1c; --warn-bg:#fff0bf; --warn-fg:#6d5200;
  --danger-bg:#fde0df; --danger-fg:#a01a1a; --exp-bg:#7a1f1f; --exp-fg:#ffffff;
  --none-bg:#e7e9ec; --none-fg:#515b66; --info-bg:#e3edf6; --info-fg:#1f4e78;
  --shadow:0 1px 2px rgba(20,32,46,.06),0 4px 14px rgba(20,32,46,.05);
  --font:"IBM Plex Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e141b; --surface:#16202a; --surface2:#1b2733; --ink:#e8eef4; --ink2:#b3c0cd; --muted:#8696a7;
  --line:#2a3846; --line2:#222f3b; --brand:#8fbbe6; --brand-ink:#0e141b; --brand-soft:#1d3144;
  --focus:#5aa0f2; --s1:#3987e5; --s2:#d95926; --total:#e8eef4;
  --ok-bg:#1f3a26; --ok-fg:#a9dca0; --warn-bg:#41350f; --warn-fg:#f3d673;
  --danger-bg:#4a1d1d; --danger-fg:#ff9f9f; --exp-bg:#8a2424; --exp-fg:#fff0f0;
  --none-bg:#2a343e; --none-fg:#a9b4bf; --info-bg:#1d3144; --info-fg:#a8cdf2;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e141b; --surface:#16202a; --surface2:#1b2733; --ink:#e8eef4; --ink2:#b3c0cd; --muted:#8696a7;
  --line:#2a3846; --line2:#222f3b; --brand:#8fbbe6; --brand-ink:#0e141b; --brand-soft:#1d3144;
  --focus:#5aa0f2; --s1:#3987e5; --s2:#d95926; --total:#e8eef4;
  --ok-bg:#1f3a26; --ok-fg:#a9dca0; --warn-bg:#41350f; --warn-fg:#f3d673;
  --danger-bg:#4a1d1d; --danger-fg:#ff9f9f; --exp-bg:#8a2424; --exp-fg:#fff0f0;
  --none-bg:#2a343e; --none-fg:#a9b4bf; --info-bg:#1d3144; --info-fg:#a8cdf2;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.55;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.wrap{max-width:1220px;margin:0 auto}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}

/* header */
.top{display:flex;align-items:center;gap:14px 18px;flex-wrap:wrap;padding:22px 0 16px}
.logo{display:flex;align-items:center;gap:12px;min-width:0}
.mark{width:42px;height:42px;border-radius:10px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;flex:none}
.logo h1{font-size:20px;line-height:1.25;margin:0;font-weight:700;letter-spacing:-.01em}
.logo small{display:block;font-size:12px;color:var(--muted);letter-spacing:.06em;font-weight:500}
.conn{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:12.5px;color:var(--ink2);text-align:right}
.conn b{font-weight:600}
.dotc{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:1px}
.dotc.on{background:#2e9b57}.dotc.off{background:#d98c1f}
.qup{display:inline-flex;align-items:center;gap:7px;cursor:pointer;white-space:nowrap}
.qup:focus-within{outline:2px solid var(--focus);outline-offset:2px}
body.dragging::after{content:'놓으면 재고를 바로 반영합니다';position:fixed;inset:10px;border:3px dashed var(--brand);border-radius:16px;background:color-mix(in srgb,var(--brand-soft) 85%,transparent);display:grid;place-items:center;font-size:20px;font-weight:700;color:var(--brand);z-index:50;pointer-events:none}
.ibar{padding:14px 18px}
.ibar .sub{margin:3px 0 0}
.ibar table td{padding:6px 8px}
.sync-steps{margin:8px 0 0;padding-left:20px;font-size:12.5px;color:var(--ink2);line-height:1.7}
.dotc.sync{background:#2a78d6}.dotc.err{background:#d0453a}
.meeting{font-size:12px;color:var(--brand);background:var(--brand-soft);padding:2px 9px;border-radius:99px;font-weight:600}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin;margin-bottom:18px}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:11px 16px 10px;font-weight:600;color:var(--ink2);white-space:nowrap;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand)}

/* toolbar */
.bar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-bottom:16px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>label,.lbl{font-size:12px;font-weight:600;color:var(--ink2);letter-spacing:.02em}
.field em{font-style:italic;font-weight:400;color:var(--muted)}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:8px 10px;min-height:38px;width:100%}
textarea{resize:vertical;min-height:84px}
input[readonly]{background:var(--surface2);color:var(--ink2)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:8px 13px;font-weight:500;color:var(--ink2);min-height:38px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;min-height:38px;color:var(--ink)}
.btn:hover{border-color:var(--brand)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.warn{color:var(--danger-fg);border-color:var(--danger-fg)}
.btn.sm{padding:4px 10px;min-height:30px;font-size:12.5px}
.sp{flex:1}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:18px 20px;min-width:0}
.card h2{font-size:15px;margin:0 0 3px;font-weight:700;letter-spacing:-.005em}
.card .sub{font-size:12.5px;color:var(--muted);margin:0 0 14px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.stack{display:flex;flex-direction:column;gap:16px}
.kpi{padding:16px 18px}
.kpi .k{font-size:12px;font-weight:600;color:var(--ink2);letter-spacing:.02em}
.kpi .v{font-size:28px;font-weight:700;line-height:1.2;margin:4px 0 2px;letter-spacing:-.02em}
.kpi .d{font-size:12.5px;color:var(--ink2)}
.sec-title{display:flex;align-items:baseline;gap:10px;margin:0 0 12px}
.sec-title h2{margin:0}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px 2px 7px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap;line-height:1.5}
.pill i{font-style:normal;font-size:10px;width:14px;height:14px;border-radius:50%;display:inline-grid;place-items:center;background:rgba(255,255,255,.55);color:inherit}
.p-정상{background:var(--ok-bg);color:var(--ok-fg)}
.p-경고{background:var(--warn-bg);color:var(--warn-fg)}
.p-위험{background:var(--danger-bg);color:var(--danger-fg)}
.p-만료{background:var(--exp-bg);color:var(--exp-fg)}
.p-재고없음,.p-미입력{background:var(--none-bg);color:var(--none-fg)}
.p-info{background:var(--info-bg);color:var(--info-fg)}
.chip{display:inline-block;padding:1px 8px;border-radius:5px;font-size:12px;font-weight:600;background:var(--brand-soft);color:var(--brand)}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 11px;text-align:left;border-bottom:1px solid var(--line2);vertical-align:middle}
th{background:var(--brand);color:var(--brand-ink);font-weight:600;font-size:12.5px;white-space:nowrap;position:sticky;top:0}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{filter:brightness(1.1)}
td.r,th.r{text-align:right}
td{white-space:nowrap}
td.nm{min-width:210px;font-weight:600;white-space:normal}
td.plan{min-width:260px;color:var(--ink2);white-space:normal}
tbody tr:hover td{background:var(--surface2)}
tfoot td{background:var(--brand-soft);font-weight:700;border-bottom:0}
tr.dim td{color:var(--muted)}
.pos{color:var(--ink)}
.delta{white-space:nowrap}
.flag{display:inline-block;font-size:11px;font-weight:700;color:var(--warn-fg);background:var(--warn-bg);border-radius:4px;padding:0 5px;margin-left:5px}

/* bars */
.sbar{display:flex;gap:2px;height:16px}
.sbar span{display:block;min-width:3px;border-radius:3px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--ink2);margin:10px 0 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}
.hb{display:grid;grid-template-columns:52px 1fr 70px;align-items:center;gap:10px;margin:7px 0}
.hb .tr{display:flex;gap:2px;height:20px}
.hb .tr span{display:block;height:100%}
.hb .tr span:first-child{border-radius:0 0 0 0}
.hb .t{font-weight:600;text-align:right}
.stk{cursor:default}
.cov{display:flex;flex-direction:column;gap:3px;min-width:150px}
.cov div{height:7px;border-radius:2px}

/* chart */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--ink2);font-size:11.5px;font-family:var(--font)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ax{stroke:var(--muted);stroke-width:1}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--bg);padding:7px 10px;border-radius:7px;font-size:12.5px;line-height:1.45;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:260px;display:none}
#tip b{font-weight:700}
.spark{display:block}

/* forms */
.fgrid{display:grid;gap:12px 14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr))}
.layout{display:grid;gap:16px;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);align-items:start}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}}
.radio{display:flex;gap:8px;flex-wrap:wrap}
.radio label{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:7px 12px;background:var(--surface);cursor:pointer;font-weight:500}
.radio input{accent-color:var(--brand)}
.prev{position:sticky;top:12px}
.prev .big{font-size:26px;font-weight:700;letter-spacing:-.02em}
.kv{display:grid;grid-template-columns:96px 1fr;gap:7px 12px;font-size:13px;margin:12px 0 0}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.prog{height:8px;border-radius:99px;background:var(--line2);overflow:hidden;margin:8px 0 12px}
.prog span{display:block;height:100%;background:var(--brand);border-radius:99px}
.items{display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));max-height:360px;overflow:auto}
.it{display:flex;align-items:center;gap:8px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;min-width:0}
.it:hover{border-color:var(--brand)}
.it span.n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px}
.it.done{background:var(--surface2)}
.ck{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:10px;line-height:1}
.it.done .ck{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.note{background:var(--info-bg);color:var(--info-fg);border-radius:8px;padding:9px 12px;font-size:12.5px}
.note.w{background:var(--warn-bg);color:var(--warn-fg)}
.issue{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.issue>header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface2);border-bottom:1px solid var(--line2);flex-wrap:wrap}
.issue>header b{font-size:13.5px}
.issue ul{margin:0;padding:6px 14px 10px 30px;font-size:13px;color:var(--ink2)}
.issue li{margin:4px 0}
.lg{font-size:12.5px;display:grid;grid-template-columns:132px 100px 1fr;gap:3px 12px;padding:8px 0;border-bottom:1px solid var(--line2)}
@media (max-width:640px){.lg{grid-template-columns:1fr}}
.insight{margin:0;padding-left:18px;color:var(--ink2);display:grid;gap:6px}
.insight b{color:var(--ink)}
.empty{padding:26px;text-align:center;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-weight:600;font-size:13px;z-index:60;display:none;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:calc(100vw - 32px)}
.modal{position:fixed;inset:0;background:rgba(10,16,24,.55);z-index:70;display:grid;place-items:center;padding:16px}
.modal .card{width:min(640px,100%)}
.hide-sm{display:revert}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;opacity:0}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:2px dashed var(--line);border-radius:12px;padding:26px 16px;text-align:center;cursor:pointer;background:var(--surface2);color:var(--ink2)}
.drop:hover,.drop.on,.drop:focus-within{border-color:var(--brand);background:var(--brand-soft)}
.drop b{color:var(--ink);font-size:14px}
select.cell{min-height:32px;padding:4px 8px;font-size:12.5px;min-width:230px}
.chk{display:inline-flex;gap:8px;align-items:center;font-weight:500;cursor:pointer}
.chk input{accent-color:var(--brand)}
details.raw{margin-top:12px}
details.raw summary{cursor:pointer;font-weight:600;color:var(--ink2);font-size:12.5px}
.raw td{max-width:180px;overflow:hidden;text-overflow:ellipsis;font-size:12px}
@media (max-width:640px){.qup{width:100%;justify-content:center}.conn{margin-left:0;align-items:flex-start;text-align:left}}
@media (prefers-reduced-motion:no-preference){.tab,.btn,.it{transition:border-color .12s,color .12s,background .12s}}
</style>

<div class="wrap">
  <header class="top">
    <div class="logo">
      <div class="mark" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V9l7-5 7 5v11"/><path d="M9 20v-6h6v6"/><path d="M12 4v3"/></svg>
      </div>
      <div><small>FAMNET</small><h1>팜넷 재고·유통 관리 시스템</h1></div>
    </div>
    <div class="conn">
      <span id="connLine"><span class="dotc"></span>연결 확인 중</span>
      <span id="meetLine"></span>
    </div>
    <label class="btn pri qup" for="qFile" title="이지어드민 재고 엑셀을 올리면 바로 반영합니다. 화면 어디에 끌어다 놓아도 됩니다">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4"/><path d="m6 10 6-6 6 6"/><path d="M4 20h16"/></svg>
      재고 엑셀 올리기<input type="file" id="qFile" class="sr" accept=".xlsx,.xls,.csv,.txt"></label>
  </header>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <main id="view"></main>
</div>
<div id="tip" role="tooltip"></div>
<div id="toast" role="status"></div>
<div id="modalRoot"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<script>

function syncRepo(){
  const h = location.hostname.match(/^([^.]+)\.github\.io$/i), p = location.pathname.split('/').filter(Boolean)[0];

}
const b64e = str => { const b = new TextEncoder().encode(str); let x = ''; for (let i = 0; i < b.length; i += 0x8000) x += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(x); };

  return fetch(`https://api.github.com/repos/${syncRepo()}${path}`, Object.assign({}, opt, {cache: 'no-store',

async function fetchRemote(){ // {data, sha} · 아직 없으면 null

    if (r.status === 404) return null;
    if (r.status === 401 || r.status === 403) throw new Error('auth');
    if (!r.ok) throw new Error('net');
    const j = await r.json();
    const raw = j.content ? b64d(j.content) : await (await ghApi('/contents/data.json', {headers: {Accept: 'application/vnd.github.raw+json'}})).text();
    return {data: JSON.parse(raw), sha: j.sha};
  }
  if (!/^https?:$/.test(location.protocol)) return null;
  const r = await fetch(`data.json?t=${Date.now()}`, {cache: 'no-store'});
  if (r.status === 404) return null;
  if (!r.ok) throw new Error('net');
  return {data: await r.json(), sha: null};
}
const busyEditing = () => { const a = document.activeElement; return (UI.tab === 'entry' && UI.E) || (a && a.closest && a.closest('#view') && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)); };

function deltaList(list){
  const d = list.filter(e => e.delta !== null && e.delta !== 0);
  if (!d.length) return '<div class="empty">비교 가능한 변동이 없습니다.</div>';
  const mx = Math.max(...d.map(e => Math.abs(e.delta)));
  const dn = [...d].sort((a,b) => a.delta - b.delta).slice(0,4);
  const up = [...d].sort((a,b) => b.delta - a.delta).filter(e => e.delta > 0).slice(0,2);
  const row = e => `<div class="hb" style="grid-template-columns:minmax(0,1fr) 110px 74px"><div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(e.r.name)}">${esc(norm(e.r.name))}</div><div class="tr" style="height:12px"><span data-tip="<b>${esc(norm(e.r.name))}</b> ${signed(e.delta)}" style="width:${Math.max(Math.abs(e.delta)/mx*100,3)}%;background:${e.delta<0?'var(--muted)':'var(--s1)'};border-radius:3px;opacity:${e.delta<0?.6:1}"></span></div><div class="t num delta">${arrow(e.delta)} ${fmt(Math.abs(e.delta))}</div></div>`;
  return `<div class="lbl" style="margin-top:2px">감소(출고·소진)</div>${dn.map(row).join('')}${up.length?`<div class="lbl" style="margin-top:12px">증가(입고·신규)</div>${up.map(row).join('')}`:''}`;
}
function briefText(m, base, sm, risk, warn, late, dTot, dPct){
  const L = [];
  L.push(`[${mLabel(m)} 재고·유통 현황] 기준일 ${dot(base)}`);
  L.push(`- 총 보유재고 ${fmt(sm.tot)} (지브레인 ${fmt(sm.zb)} / 사업단 ${fmt(sm.biz)})${dTot!==null?`, 전월 대비 ${signed(dTot)} (${dPct>0?'+':''}${dPct.toFixed(1)}%)`:''}`);
  L.push(`- 관리상태: ${STATUS.map(s => `${s} ${sm.cnt[s]||0}`).join(' · ')}`);
  if (risk.length){ L.push(`- 위험·만료 품목`); risk.sort((a,b)=>a.days-b.days).forEach(e => L.push(`  · ${e.r.name} / 잔여 ${e.days}일 / 재고 ${fmt(e.tot)} / ${e.r.plan||'실행계획 미작성'}`)); }
  if (warn.length){ L.push(`- 경고 품목(${warn.length}개) 중 잔여일 짧은 순`); warn.sort((a,b)=>a.days-b.days).slice(0,5).forEach(e => L.push(`  · ${e.r.name} / 잔여 ${e.days}일 / 재고 ${fmt(e.tot)}`)); }
  if (late.length){ L.push(`- 소비기한 내 소진 지연 우려(추세 추정)`); late.slice(0,5).forEach(x => L.push(`  · ${x.e.r.name} / 잔여 ${x.e.days}일 vs 소진 예상 ${x.o.need}일`)); }
  return L.join('\n');
}

function liveInfo(){ // 지금 '실시간'으로 볼 자료: 마지막으로 올린 파일의 월 (아직 없으면 가장 최근 월간 자료)

       <dt>관리 원칙</dt><dd>${hint||'–'}</dd><dt>실행계획</dt><dd>${esc(E.plan)||'<span class="muted">미작성</span>'}</dd></dl>

}
const NOTE_SCHEDULE = '해당 월 10일 전까지 마무리한 뒤 매월 셋째 주 월요일 유통 회의에 참석합니다.';
function bindEntry(){
  const E = UI.E, rerender = () => { const y = scrollY; render(); scrollTo(0, y); };
  const read = () => {
    E.zb = $('#eZb').value; E.biz = $('#eBiz').value; E.mfg = $('#eMfg').value; E.exp = $('#eExp').value; E.plan = $('#ePlan').value;
  };
  $$('input[name=emode]').forEach(r => r.onchange = () => { read(); E.custom = r.value === 'custom' && r.checked; if (E.custom){ E.id = null; E.name = ''; } rerender(); });
  $('#eCat').onchange = e => { read(); E.cat = e.target.value; if (!E.id){ E.name = ''; } rerender(); };
  const nm = $('#eName');
  if (nm) nm.onchange = e => {
    read(); const v = e.target.value; E.name = v;
    const ex = rowsOf(UI.month).find(r => norm(r.name) === norm(v));
    if (ex){ const keep = {cat: E.cat}; loadEntry(ex.id); if (keep.cat) UI.E.cat = ex.cat; }
    else { E.id = null; const pm = prevMonth(UI.month); const p = pm && findByKey(pm, norm(v)); if (p && !E.exp){ E.exp = p.exp || ''; E.mfg = p.mfg || ''; } const mp = S.master.find(x => x.name === v); if (mp) E.cat = mp.cat; }
    rerender();
  };
  const nt = $('#eNameT'); if (nt) nt.oninput = e => { E.name = e.target.value; };
  ['eZb','eBiz','eMfg','eExp','ePlan'].forEach(id => $('#'+id).addEventListener('input', () => { read(); softPreview(); }));
  $('#eBase').onchange = e => { if (e.target.value){ S.months[UI.month].base = e.target.value; save(); rerender(); } };
  $('#btnNew').onclick = () => { newEntry(); UI.confirm = ''; rerender(); };
  const del = $('#btnDel');
  if (del) del.onclick = () => {
    if (UI.confirm !== 'delrow'){ UI.confirm = 'delrow'; rerender(); return; }
    const r = rowsOf(UI.month); const i = r.findIndex(x => x.id === E.id);
    if (i >= 0){ logAdd(UI.month, r[i].name, '삭제', '월간 자료에서 품목 삭제'); r.splice(i, 1); save(); }
    UI.confirm = ''; newEntry(); render(); toast('삭제했습니다');
  };
  $('#entryForm').onsubmit = ev => {
    ev.preventDefault(); read();
    if (E.custom) E.name = ($('#eNameT')?.value || '').trim();
    if (!E.cat){ toast('구분을 선택하세요'); return; }
    if (!E.name){ toast('상품명을 입력하거나 선택하세요'); return; }
    if (E.zb === '' && E.biz === ''){ toast('지브레인 또는 사업단 재고를 입력하세요'); return; }
    if ((+E.zb < 0) || (+E.biz < 0)){ toast('재고는 0 이상으로 입력하세요'); return; }
    const rows = rowsOf(UI.month);
    let r = E.id ? rows.find(x => x.id === E.id) : rows.find(x => norm(x.name) === norm(E.name));
    const vals = {cat: E.cat, zb: E.zb === '' ? 0 : +E.zb, biz: E.biz === '' ? 0 : +E.biz, mfg: E.mfg || null, exp: E.exp || null, plan: E.plan.trim()};
    if (r){
      const before = calc(r, S.months[UI.month].base).tot;
      Object.assign(r, vals); delete r.tot;
      logAdd(UI.month, r.name, '수정', `총 보유재고 ${fmt(before)} → ${fmt(calc(r, S.months[UI.month].base).tot)}`);
    } else {
      r = {id: S.nextId++, name: E.name, ...vals}; rows.push(r);
      if (!S.master.some(p => norm(p.name) === norm(E.name))) S.master.push({cat: E.cat, name: E.name});
      logAdd(UI.month, r.name, '추가', `신규 품목 · 총 보유재고 ${fmt(calc(r, S.months[UI.month].base).tot)}`);
    }
    save(); toast(`${norm(r.name)} 저장 완료`); newEntry(); render();
  };
}
function softPreview(){ // 입력 중에는 전체 재렌더 대신 계산 필드만 갱신 (포커스 유지)
  const E = UI.E, m = UI.month;

}

function allTsv(){
  const head = ['관리월','순번','관리상태','구분','상품명','총 보유재고','지브레인 재고','사업단 재고','제조일자','소비기한','잔여일','유통 실행계획'];
  const out = [head.join('\t')];
  months().forEach(m => enrich(m, S.months[m].base).forEach(e => out.push([m,e.i+1,e.st,e.r.cat,e.r.name,e.tot??'',e.r.zb??'',e.r.biz??'',e.r.mfg||'',e.r.exp||'',e.days??'',(e.r.plan||'').replace(/\s+/g,' ')].join('\t'))));
  return out.join('\n');
}

/* ---------- 점검·기록 ---------- */
function runChecks(){
  const out = [];
  const add = (lv, title, desc, items) => { if (items.length) out.push({lv, title, desc, items}); };
  const mm = months();
  const list = (fn) => mm.flatMap(m => enrich(m, S.months[m].base).filter(e => fn(e, m)).map(e => ({m, e})));
  add('오류', '합계가 지브레인+사업단 재고와 다름', '합계 칸에 직접 입력한 값이 구성 재고와 맞지 않습니다. 구성별 수량을 확인하세요.',
    list(e => e.mism).map(x => ({t: `${mLabel(x.m)} · ${x.e.r.name}`, d: `합계 ${fmt(x.e.tot)} / 구성 합 ${fmt((+x.e.r.zb||0)+(+x.e.r.biz||0))}`, id: x.e.r.id, m: x.m})));
  add('오류', '제조일자가 소비기한보다 늦음', '일자가 뒤바뀌었거나 연도가 잘못 입력되었을 가능성이 있습니다.',
    list(e => e.r.mfg && e.r.exp && e.r.mfg > e.r.exp).map(x => ({t: `${mLabel(x.m)} · ${x.e.r.name}`, d: `제조 ${dot(x.e.r.mfg)} / 소비기한 ${dot(x.e.r.exp)}`, id: x.e.r.id, m: x.m})));
  add('확인', '소비기한 미입력 (재고 보유)', '소비기한이 없으면 잔여일과 관리상태를 판정할 수 없습니다.',
    list(e => e.tot > 0 && !e.r.exp).map(x => ({t: `${mLabel(x.m)} · ${x.e.r.name}`, d: `재고 ${fmt(x.e.tot)}`, id: x.e.r.id, m: x.m})));
  add('확인', '제조일자 미입력 (재고 보유)', '제조일자가 비어 있습니다.',
    list(e => e.tot > 0 && !e.r.mfg).map(x => ({t: `${mLabel(x.m)} · ${x.e.r.name}`, d: `재고 ${fmt(x.e.tot)}`, id: x.e.r.id, m: x.m})));
  const last = mm[mm.length-1];
  add('확인', `${mLabel(last)} 유통 실행계획 미작성`, '재고가 있는데 실행계획이 비어 있는 품목입니다. 유통 회의 전 작성이 필요합니다.',
    list((e,m) => m === last && e.tot > 0 && !(e.r.plan||'').trim()).map(x => ({t: x.e.r.name, d: `재고 ${fmt(x.e.tot)} · ${x.e.st}`, id: x.e.r.id, m: x.m})));
  add('확인', `${mLabel(last)} 재고 미입력`, '지브레인·사업단 재고가 모두 비어 있습니다.',
    list((e,m) => m === last && e.tot === null).map(x => ({t: x.e.r.name, d: '재고 입력 필요', id: x.e.r.id, m: x.m})));
  add('확인', '소비기한이 지난 재고', '출고를 중단하고 폐기·반품 여부를 검토해야 합니다.',
    list((e,m) => m === last && e.st === '만료').map(x => ({t: x.e.r.name, d: `잔여일 ${x.e.days}일 · 재고 ${fmt(x.e.tot)}`, id: x.e.r.id, m: x.m})));
  const miss = S.master.filter(p => !findByKey(last, norm(p.name)));
  add('확인', `${mLabel(last)} 월간 표에 없는 등록 상품`, '기준정보에는 있으나 이 달 자료에 행이 없습니다.', miss.map(p => ({t: p.name, d: p.cat})));
  const nameVar = {}; mm.forEach(m => rowsOf(m).forEach(r => { const k = norm(r.name); (nameVar[k] = nameVar[k] || new Set()).add(r.name); }));
  add('참고', '월별로 상품명 표기가 달라진 품목', '소비기한 표기([yy.mm.dd])가 붙거나 빠졌습니다. 추이는 괄호를 뺀 이름으로 묶어 연결했습니다.',
    Object.entries(nameVar).filter(([k,v]) => v.size > 1).map(([k,v]) => ({t: k, d: [...v].join('  →  ')})));
  const noData = S.tabs.filter(t => !S.months[t.tab] && t.tab < last);
  add('참고', '기준정보에 있으나 자료가 없는 월', '원본 엑셀에서 해당 월 시트가 삭제되어 추이 표에 자료 없음으로 표시됩니다.', noData.map(t => ({t: mLabel(t.tab), d: ''})));
  return out;
}
function viewCheck(){
  const checks = runChecks();
  const lvPill = lv => `<span class="pill ${lv==='오류'?'p-위험':lv==='확인'?'p-경고':'p-info'}">${lv}</span>`;
  const chk = checks.length ? checks.map(c => `<div class="issue"><header>${lvPill(c.lv)}<b>${esc(c.title)}</b><span class="muted num">${c.items.length}건</span></header>
    <p class="sub" style="margin:8px 14px 0">${esc(c.desc)}</p><ul>${c.items.map(i => `<li>${esc(i.t)}${i.d?` <span class="muted">— ${esc(i.d)}</span>`:''} ${i.id?`<button class="btn sm" data-fix="${i.m}|${i.id}">수정</button>`:''}</li>`).join('')}</ul></div>`).join('')
    : '<div class="empty">점검할 항목이 없습니다. 자료가 모두 정상입니다.</div>';
  const corr = SEED.corrections.map(c => `<li>${mLabel(c.month)} <b>${esc(c.name)}</b> 총 보유재고 ${fmt(c.from)} → <b>${fmt(c.to)}</b></li>`).join('');
  const log = S.log.length ? S.log.slice(0, 60).map(l => { const d = new Date(l.t);
    return `<div class="lg"><span class="muted num">${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}</span><span><b>${esc(l.action)}</b>${l.month&&l.month!=='-'?` · ${mShort(l.month)}`:''}</span><span>${esc(l.name)} <span class="muted">${esc(l.detail||'')}</span></span></div>`; }).join('') : '<div class="empty">아직 변경 기록이 없습니다. 재고를 저장하면 여기에 쌓입니다.</div>';
  const html = `<div class="grid g2">
   <div class="stack">
    <div class="card"><h2>입력 데이터 점검</h2><p class="sub">현재 저장된 월별 자료를 자동으로 검사한 결과입니다. 수정하면 바로 갱신됩니다.</p><div class="stack" style="gap:12px">${chk}</div></div>
   </div>
   <div class="stack">
    <div class="card"><h2>원본 엑셀에서 찾은 문제와 처리</h2><p class="sub">260824 파일을 분석해 이 시스템에 옮기면서 정리한 내용입니다.</p>
      <ul class="insight">
        <li><b>9월 시트 합계가 10월 시트의 전월 값과 불일치</b>했습니다. 10월 시트가 기록한 값으로 보정했습니다. 사업단 재고가 0이어서 지브레인 재고도 같은 값으로 맞췄습니다.
          <ul style="margin:6px 0 0;padding-left:18px">${corr}</ul></li>
        <li><b>금산 약과(9월)</b> 합계 800이 직접 입력되어 지브레인+사업단(0)과 달랐습니다. 값은 그대로 두고 합계 확인 표시를 달았습니다.</li>
        <li><b>미꾸야 자일리톨 캔디</b> 제조일자(26.11.08)가 소비기한(26.11.07)보다 늦어 연도 오기입으로 보입니다. 원본 값을 유지하고 점검 항목으로 올렸습니다.</li>
        <li><b>'품목별 재고추이' 시트</b> 9~11행(5~7월)에 #REF! 오류가 있고, 월별 시트의 12개월 이력 열(K~S)은 수식 연쇄 오류로 비어 있었습니다. 이 시스템은 월별 자료를 직접 연결해 두 문제를 모두 없앴습니다.</li>
        <li><b>이력 열 T·U(8·9월)</b>가 수식 없이 값으로 입력되어 있어 월별 시트와 따로 움직였습니다. 여기서는 월별 시트 하나를 기준으로 계산합니다.</li>
        <li>5~7월 시트는 삭제되어 자료가 없고 11·12월은 아직 작성 전입니다. 기준정보의 월 목록은 그대로 유지했습니다.</li>
      </ul></div>
    <div class="card"><h2>변경 기록</h2><p class="sub">이 브라우저에서 저장·삭제한 내용을 최근 순으로 보여 줍니다.</p>${log}</div>
   </div></div>`;
  return {html: html + syncCard(), after(){ bindSync(); }};
}

/* ---------- 엑셀 업로드 (3PL 재고 파일 → 월간 재고 자동 정리) ---------- */
// 상품명 비교용 키: 끝의 [소비기한] 표기, 공백·기호를 지운 소문자
const sq = s => norm(s).toLowerCase().replace(/[\s_\-()\[\]{}·.,\/\\]+/g, '');
const fk = s => String(s ?? '').toLowerCase().replace(/[\s_\-()\[\]{}·.,\/\\]+/g, ''); // 끝의 [냉동] 같은 표기도 지우지 않는 키
const UP_DEF = {
  code: {pri:['상품코드','품목코드','제품코드','자체코드','sku'], ex:[]},
  name: {pri:['상품명','품목명','제품명','품명','상품','품목','제품'], ex:['코드','번호','구분','분류','수량','바코드']},
  qty:  {pri:['현재고','현재재고','재고수량','총재고','정상재고','가용재고','실재고','재고','수량'], ex:['코드','불량','예정','입고','출고','안전','금액','단가','위치','로케','일자','번호','경고','위험','관리','합포']},
  exp:  {pri:['소비기한','유통기한','유효기한','유효기간','소비기일','만료일'], ex:[]},
  mfg:  {pri:['제조일자','제조일','제조년월일','생산일자','생산일'], ex:[]},
  cat:  {pri:['카테고리','상품분류','분류','브랜드'], ex:['코드']}
};
const UP_LABEL = {code:'상품코드', name:'상품명', qty:'수량(재고)', exp:'소비기한', mfg:'제조일자', cat:'카테고리'};
const UP_OPT = {code:1, exp:1, mfg:1, cat:1};
function upScore(label, def){
  const t = String(label ?? '').replace(/\s+/g, '').toLowerCase();
  if (!t) return -1;
  if (def.ex.some(x => t.includes(x))) return -1;
  const i = def.pri.findIndex(p => t === p);
  if (i >= 0) return 100 - i;
  const j = def.pri.findIndex(p => t.includes(p));
  return j >= 0 ? 50 - j : -1;
}
function upColsAt(aoa, hdr){
  const row = aoa[hdr] || [], map = {code:-1, name:-1, qty:-1, exp:-1, mfg:-1, cat:-1}, used = new Set();
  ['name','qty','code','exp','mfg','cat'].forEach(f => {
    let best = -1, bs = -1;
    row.forEach((c, i) => { if (used.has(i)) return; const s = upScore(c, UP_DEF[f]); if (s > bs){ bs = s; best = i; } });
    if (bs >= 0){ map[f] = best; used.add(best); }
  });
  // 날짜 열로 잡혔어도 값이 날짜가 아니면(예: 유통기한 '0' = 보관일수) 쓰지 않는다
  ['exp','mfg'].forEach(f => {
    if (map[f] < 0) return;
    let ok = 0;
    for (let i = hdr + 1; i < Math.min(aoa.length, hdr + 81); i++) if (toISO((aoa[i] || [])[map[f]])) ok++;
    if (!ok) map[f] = -1;
  });
  return map;
}
function upDetect(aoa){ // 상품명·수량 열이 함께 보이는 첫 행을 머리글로 본다
  let best = {hdr:0, map:upColsAt(aoa, 0), n:-1};
  for (let h = 0; h < Math.min(aoa.length, 25); h++){
    const map = upColsAt(aoa, h);
    if (map.name >= 0 && map.qty >= 0) return {hdr:h, map};
    const n = (map.name >= 0) + (map.qty >= 0) + (map.exp >= 0) + (map.mfg >= 0);
    if (n > best.n) best = {hdr:h, map, n};
  }
  return {hdr:best.hdr, map:best.map};
}
function upAoa(U){
  if (!U.cache[U.sheet]) U.cache[U.sheet] = XLSX.utils.sheet_to_json(U.wb.Sheets[U.sheet], {header:1, defval:'', raw:true, blankrows:true});
  return U.cache[U.sheet];
}
function toISO(v){
  const ok = (y, m, d) => y >= 1990 && y <= 2100 && m >= 1 && m <= 12 && d >= 1 && d <= 31 ? `${y}-${pad(m)}-${pad(d)}` : null;
  if (v == null || v === '') return null;
  if (v instanceof Date) return isNaN(v) ? null : ok(v.getFullYear(), v.getMonth()+1, v.getDate());
  if (typeof v === 'number'){
    if (v > 20000 && v < 80000){ const o = XLSX.SSF.parse_date_code(v); return o ? ok(o.y, o.m, o.d) : null; }
    if (v >= 19900101 && v <= 21001231){ const s = String(v); return ok(+s.slice(0,4), +s.slice(4,6), +s.slice(6,8)); }
    return null;
  }
  const s = String(v).trim(); let m;
  if ((m = s.match(/^(\d{4})[-./\s]+(\d{1,2})[-./\s]+(\d{1,2})/))) return ok(+m[1], +m[2], +m[3]);
  if ((m = s.match(/^(\d{2})[-./](\d{1,2})[-./](\d{1,2})\.?$/))) return ok(2000 + +m[1], +m[2], +m[3]);
  if ((m = s.match(/^(\d{4})(\d{2})(\d{2})$/))) return ok(+m[1], +m[2], +m[3]);
  return null;
}
function nameDate(name){ // 상품명 속 [27.07.20] · (27.04.21) · [2027.10.18] 표기를 소비기한으로 읽는다
  const re = /[\[(]\s*(\d{2,4})\s*[.\-\/]\s*(\d{1,2})\s*[.\-\/]\s*(\d{1,2})\s*\.?\s*[\])]/g; let m;
  while ((m = re.exec(name))){ const d = toISO(`${m[1]}.${m[2]}.${m[3]}`); if (d) return d; }
  return null;
}
function toQty(v){
  if (v == null || v === '') return null;
  if (typeof v === 'number') return Number.isFinite(v) ? v : null;
  const s = String(v).replace(/[,\s]/g, '');
  return /^-?\d+(\.\d+)?$/.test(s) ? +s : null;
}
const upCell = v => v instanceof Date ? (toISO(v) || '') : String(v ?? '');
function upAggregate(aoa, hdr, map){ // 같은 상품코드(없으면 같은 상품명)가 여러 행이면 수량을 합산
  const out = new Map(); let bad = 0;
  for (let i = hdr + 1; i < aoa.length; i++){
    const row = aoa[i], name = upCell(row[map.name]).trim();
    if (!name || /^(합계|총계|소계|total)$/i.test(name.replace(/\s+/g, ''))) continue;
    const q = toQty(row[map.qty]);
    if (q === null){ bad++; continue; }
    const nk = sq(name); if (!nk) continue;
    const code = map.code >= 0 ? upCell(row[map.code]).trim() : '';
    const key = code ? 'c:' + code : 'n:' + nk;
    let a = out.get(key);
    if (!a){ a = {key, code, name, nk, fk: fk(name), qty:0, rows:0, exp:null, mfg:null, nd:nameDate(name), cat: map.cat >= 0 ? upCell(row[map.cat]).trim() : ''}; out.set(key, a); }
    a.qty += q; a.rows++;
    if (q > 0){ // 재고가 있는 로트의 기한 중 가장 빠른 날짜를 쓴다
      const e = map.exp >= 0 ? toISO(row[map.exp]) : null, g = map.mfg >= 0 ? toISO(row[map.mfg]) : null;
      if (e && (!a.exp || e < a.exp)) a.exp = e;
      if (g && (!a.mfg || g < a.mfg)) a.mfg = g;
    }
  }
  return {list:[...out.values()], bad};
}
function upPlan(U, O){
  const ag = upAggregate(upAoa(U), U.hdr, U.map);
  const exists = !!S.months[O.month];
  const tpl = exists ? rowsOf(O.month) : rowsOf(months().filter(x => x < O.month).pop() || months().slice(-1)[0]);
  const byKey = new Map(); tpl.forEach(r => { const k = sq(r.name); if (k && !byKey.has(k)) byKey.set(k, r); });
  const learned = S.codes || {};
  const sites = [...byKey.entries()].map(([k, r]) => {
    const toks = norm(r.name).split(/[\s_\-()\[\]{}·,\/\\]+/).map(sq).filter(t => t.length >= 2);
    return {k, r, toks, len: toks.join('').length};
  }).filter(s => s.len >= 4);
  const items = ag.list.map(a => ({a, t: undefined, auto: 'none'}));
  // 1) 직접 고른 연결, 기억해 둔 상품코드는 그대로 따른다
  items.forEach(x => {
    const a = x.a, m = U.links[a.key];
    if (m !== undefined){ x.t = m; x.auto = 'manual'; }
    else {
      const lv = learned[a.code || 'n:' + a.nk];
      if (lv === '__skip'){ x.t = '__skip'; x.auto = 'ignored'; }
      else if (lv && byKey.has(lv)){ x.t = lv; x.auto = 'learned'; }
    }
  });
  const taken = new Set(items.filter(x => x.t !== undefined && x.t !== '__skip' && x.t !== '__new').map(x => x.t));
  // 2) 이름이 같거나, 월간 표 품목명의 단어가 상품명에 모두 들어 있으면 후보.
  //    한 품목에 후보가 여럿이면(같은 상품의 로트별 상품코드 등) 소비기한이 같은 것을 고른다
  const cand = new Map(), ambT = new Set();
  items.filter(x => x.t === undefined).forEach(x => {
    let k = null, exact = false;
    if (byKey.has(x.a.nk)){ k = x.a.nk; exact = true; }
    else {
      const hits = sites.filter(s => s.toks.every(t => x.a.fk.includes(t)));
      const top = hits.length ? Math.max(...hits.map(s => s.len)) : 0, best = hits.filter(s => s.len === top);
      if (best.length === 1) k = best[0].k;
    }
    if (k === null || taken.has(k)) return;
    if (!cand.has(k)) cand.set(k, []);
    cand.get(k).push({x, exact});
  });
  cand.forEach((list, k) => {
    const d = byKey.get(k).exp, dm = d ? list.filter(c => (c.x.a.nd || c.x.a.exp) === d) : [], ex = list.filter(c => c.exact);
    let pick = null, auto = 'guess';
    if (dm.length === 1){ pick = dm[0]; auto = pick.exact ? 'exact' : 'dated'; }
    else if (dm.length === 0 && list.length === 1){ pick = list[0]; auto = pick.exact ? 'exact' : 'guess'; }
    else if (dm.length === 0 && ex.length === 1){ pick = ex[0]; auto = 'exact'; }
    if (pick){ pick.x.t = k; pick.x.auto = auto; taken.add(k); }
    else { list.forEach(c => { c.x.auto = 'ambig'; }); ambT.add(k); }
  });
  // 3) 아직 짝이 없는 월간 품목: 소비기한이 같고 글자가 충분히 겹치는 상품이 하나뿐이면 후보로 올린다
  //    (예: '천마전복 삼계탕' ↔ '무주천마 Brai:t 전복 삼계탕 [27.12.14]')
  const bigrams = str => { const b = new Set(); for (let i = 0; i < str.length - 1; i++) b.add(str.slice(i, i + 2)); return b; };
  sites.forEach(s => {
    if (taken.has(s.k) || !s.r.exp) return;
    const sb = [...bigrams(s.k)]; if (sb.length < 4) return;
    const L = items.filter(x => x.t === undefined && (x.a.nd || x.a.exp) === s.r.exp && sb.filter(g => x.a.fk.includes(g)).length / sb.length >= 0.7);
    if (L.length === 1){ L[0].t = s.k; L[0].auto = 'guess'; taken.add(s.k); }
  });
  items.forEach(x => { if (x.t === undefined || (x.t !== '__skip' && x.t !== '__new' && !byKey.has(x.t))) x.t = '__skip'; });
  // 같은 품목에 연결된 상품은 수량을 합산, 마이너스 재고는 0으로 보정
  const tg = new Map();
  items.forEach(x => {
    if (x.t === '__skip' || x.t === '__new') return;
    const g = tg.get(x.t) || {key:x.t, row:byKey.get(x.t), raw:0, exp:null, mfg:null, n:0};
    g.raw += x.a.qty; g.n++;
    const e = x.a.exp || x.a.nd; if (e && (!g.exp || e < g.exp)) g.exp = e;
    if (x.a.mfg && (!g.mfg || x.a.mfg < g.mfg)) g.mfg = x.a.mfg;
    tg.set(x.t, g);
  });
  const cnt = {chg:0, same:0, new:0, skip:0, guess:0, neg:0};
  tg.forEach(g => {
    g.qty = Math.max(0, g.raw);
    const cur = g.row[O.field]; g.cur = cur == null ? null : +cur;
    g.kind = g.cur !== null && g.cur === g.qty ? 'same' : 'chg';
    cnt[g.kind]++; if (g.raw < 0) cnt.neg++;
  });
  items.forEach(x => {
    if (x.t === '__skip'){ x.kind = 'skip'; x.cur = null; x.next = null; cnt.skip++; return; }
    if (x.t === '__new'){ x.kind = 'new'; x.cur = null; x.raw = x.a.qty; x.next = Math.max(0, x.a.qty); x.neg = x.a.qty < 0; cnt.new++; if (x.neg) cnt.neg++; return; }
    const g = tg.get(x.t);
    x.g = g; x.kind = g.kind; x.cur = g.cur; x.raw = g.raw; x.next = g.qty; x.neg = g.raw < 0; x.dup = g.n > 1;
    if (x.auto === 'guess') cnt.guess++;
  });
  const missing = tpl.filter(r => !tg.has(sq(r.name)));
  // 후보가 여러 개라 연결을 못 한 품목은 0으로 만들지 않는다
  const missingOk = missing.filter(r => !ambT.has(sq(r.name)));
  const zeroRows = missingOk.filter(r => r[O.field] == null || +r[O.field] !== 0 || !exists);
  cnt.ambig = ambT.size;
  return {items, tg, cnt, missing, missingOk, zeroRows, tpl, exists, bad: ag.bad, total: ag.list.length};
}

async function parseUploadFile(file){ // 엑셀·HTML(.xls)·CSV를 읽어 열까지 찾은 업로드 상태(U)를 돌려준다
  const buf = await file.arrayBuffer();
  const bytes = new Uint8Array(buf);
  const decode = () => { try { return new TextDecoder('utf-8', {fatal:true}).decode(buf); } catch(e){ return new TextDecoder('euc-kr').decode(buf); } };
  const binary = (bytes[0] === 0x50 && bytes[1] === 0x4B) || (bytes[0] === 0xD0 && bytes[1] === 0xCF); // xlsx(zip) · 구형 xls
  let wb;
  if (!binary && /<\s*(table|html|!doctype)/i.test(new TextDecoder('utf-8').decode(bytes.subarray(0, 8192)))){
    // 이지어드민처럼 확장자만 .xls이고 실제로는 HTML 표인 파일은 브라우저로 표를 직접 읽는다
    const doc = new DOMParser().parseFromString(decode(), 'text/html');
    wb = XLSX.utils.book_new();
    [...doc.querySelectorAll('table')].filter(t => !t.parentElement.closest('table') && t.rows.length).forEach((t, i) =>
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([...t.rows].map(r => [...r.cells].map(c => c.textContent.replace(/\s+/g, ' ').trim()))), `표${i+1}`));
  } else if (!binary){ // csv · txt (UTF-8 또는 CP949)
    wb = XLSX.read(decode(), {type:'string'});
  } else wb = XLSX.read(bytes, {type:'array'}); // 날짜는 일련번호로 읽어 시간대 영향 없이 변환
  const names = wb.SheetNames.filter(n => wb.Sheets[n] && wb.Sheets[n]['!ref']);
  if (!names.length) throw new Error('nosheet');
  const U = {fileName: file.name, stamp: fileStamp(file), wb, names, sheet: names[0], cache: {}, hdr: 0, map: {code:-1, name:-1, qty:-1, exp:-1, mfg:-1, cat:-1}, links: {}};
  let found = false;
  for (const n of names){ // 상품명·수량 열이 함께 잡히는 시트를 우선 사용
    U.sheet = n; const d = upDetect(upAoa(U));

function catGuess(ct, name){ // 엑셀 카테고리('무주 천마[FAMNET]')나 상품명으로 월간 표의 구분을 추정

  const KP = {chg:['p-info','변경'], same:['p-재고없음','동일'], new:['p-정상','신규'], skip:['p-미입력','제외']};
  const rowHtml = x => {
    const [pc, pl] = KP[x.kind], d = x.cur !== null && x.next !== null ? x.next - x.cur : null;
    const flags = (x.auto === 'guess' && x.kind !== 'skip' ? ' <span class="flag">추정 연결 · 확인</span>' : '')
      + (x.auto === 'dated' && x.kind !== 'skip' ? ' <span class="muted">· 소비기한 일치</span>' : '')
      + (x.auto === 'ambig' ? ' <span class="flag">후보가 여러 개 · 직접 선택</span>' : '')
      + (x.auto === 'learned' && x.kind !== 'skip' ? ' <span class="muted">· 기억한 코드</span>' : '')
      + (x.dup ? ' <span class="flag">여러 상품이 한 품목에 연결 · 합산</span>' : '')
      + (x.neg && x.kind !== 'skip' ? ` <span class="flag">마이너스 재고 ${fmt(x.raw)} → 0 반영</span>` : '');
    return `<tr class="${x.kind==='skip'?'dim':''}"><td><span class="pill ${pc}">${pl}</span></td>
      <td class="nm">${esc(x.a.name)}${x.a.rows>1?` <span class="muted">· ${x.a.rows}행 합산</span>`:''}${flags}</td>
      <td><select class="cell" data-link="${esc(x.a.key)}" data-sel="${esc(x.t)}">${optBase}</select></td>
      <td class="r num">${x.cur===null?'–':fmt(x.cur)}</td><td class="r num"><b>${x.kind==='skip'?fmt(x.a.qty):(x.next===null?'–':fmt(x.next))}</b></td>
      <td class="r num delta">${d===null||d===0?'–':`${arrow(d)} ${fmt(Math.abs(d))}`}</td></tr>`;
  };
  const thead = `<thead><tr><th>상태</th><th>엑셀 상품명</th><th>반영 대상</th><th class="r">현재 ${O.field==='biz'?'사업단':'지브레인'}</th><th class="r">엑셀 수량</th><th class="r">증감</th></tr></thead>`;
  const linked = P.items.filter(x => x.kind !== 'skip');
  const skipped = P.items.filter(x => x.kind === 'skip').sort((a, b) => (b.a.qty !== 0) - (a.a.qty !== 0) || b.a.qty - a.a.qty);
  const skipStock = skipped.filter(x => x.a.qty > 0).length;
  const expOn = U.map.exp >= 0 || U.map.mfg >= 0 || P.items.some(x => x.a.nd);
  const cats = [...new Set(S.master.map(p => p.cat).concat(S.cats).concat(['미분류']))];
  const canApply = c.chg + c.same + c.new > 0;
  const filled = P.exists ? P.tpl.filter(r => r[O.field] != null).length : 0;
  const step3 = `<div class="card"><h2>3. 반영 미리보기</h2><p class="sub">${mLabel(O.month)}${P.exists?'':' (새로 만드는 월 탭)'} · ${fName}에 반영합니다. 오른쪽 연결 칸에서 품목을 바꾸거나 제외할 수 있습니다.</p>
    <div class="bar" style="margin-bottom:12px"><span class="pill p-info">변경 ${c.chg}</span><span class="pill p-재고없음">동일 ${c.same}</span><span class="pill p-정상">신규 ${c.new}</span><span class="pill p-미입력">제외 ${c.skip}</span>${c.guess?`<span class="pill p-경고">추정 연결 ${c.guess}</span>`:''}${c.neg?`<span class="pill p-경고">마이너스→0 ${c.neg}</span>`:''}<span class="muted">엑셀 상품 ${P.total}종${P.bad?` · 수량을 읽지 못해 건너뛴 행 ${P.bad}`:''}</span></div>
    ${P.exists && filled >= P.tpl.length * 0.5 && c.chg > 0 ? `<div class="note w" style="margin-bottom:12px">이미 재고가 입력된 월입니다. 반영하면 ${c.chg}개 품목의 ${fName} 값이 바뀝니다. (반영 후 되돌릴 수 있습니다)</div>` : ''}
    ${c.guess ? `<div class="note w" style="margin-bottom:12px">이름이 비슷해서 연결했지만 소비기한으로는 확인되지 않은 상품이 ${c.guess}개('추정 연결') 있습니다. 반영 전에 연결이 맞는지 확인하세요. 반영하면 상품코드를 기억해 다음부터 자동으로 연결합니다.</div>` : ''}
    ${c.neg ? `<div class="note" style="margin-bottom:12px">3PL 재고가 마이너스인 상품은 0으로 보정해 반영합니다. (사이트는 0 이상만 입력할 수 있습니다)</div>` : ''}
    <div class="tw" style="max-height:520px"><table>${thead}<tbody>${linked.map(rowHtml).join('') || '<tr><td colspan="6" class="empty">월간 표와 연결된 상품이 없습니다. 아래 \'연결되지 않은 상품\'에서 직접 연결하세요.</td></tr>'}</tbody></table></div>
    ${skipped.length ? `<details class="raw" ${linked.length ? '' : 'open'}><summary>연결되지 않은 상품 ${skipped.length}개${skipStock ? ` (재고가 있는 상품 ${skipStock}개)` : ''} — 같은 상품이면 연결하고, 새로 관리할 상품이면 '신규 품목으로 추가'를 고르세요</summary><div class="tw" style="margin-top:8px;max-height:420px"><table>${thead}<tbody>${skipped.map(rowHtml).join('')}</tbody></table></div></details>` : ''}
    ${P.missing.length ? `<details class="raw"><summary>월간 표에는 있으나 엑셀과 연결되지 않은 품목 ${P.missing.length}개</summary><div class="tw" style="margin-top:8px"><table><tbody>${P.missing.map(r => `<tr><td>${esc(r.cat)}</td><td class="nm">${esc(r.name)}</td><td class="r num">${r[O.field]==null?'–':fmt(r[O.field])}</td></tr>`).join('')}</tbody></table></div></details>` : ''}
    <div class="fgrid" style="margin-top:16px">
      <div class="field"><span class="lbl">연결되지 않은 월간 품목</span><label class="chk"><input type="checkbox" id="uZero" ${O.zero?'checked':''}>${fName}를 0으로 처리 (${P.zeroRows.length}개)</label></div>
      ${expOn ? `<div class="field"><label for="uDates">소비기한·제조일자</label><select id="uDates"><option value="fill" ${O.dates==='fill'?'selected':''}>비어 있는 칸만 엑셀 값으로 채움</option><option value="overwrite" ${O.dates==='overwrite'?'selected':''}>엑셀 값으로 덮어씀</option><option value="none" ${O.dates==='none'?'selected':''}>건드리지 않음</option></select></div>` : ''}
      ${c.new ? `<div class="field"><label for="uNewCat">신규 품목 구분</label><select id="uNewCat">${cats.map(x => `<option ${x===O.newCat?'selected':''}>${esc(x)}</option>`).join('')}</select></div>` : ''}
    </div>
    <div class="bar" style="margin:16px 0 0"><button class="btn pri" id="uApply" ${canApply?'':'disabled'}>이 내용으로 반영</button><button class="btn" id="uClear">파일 지우기</button></div></div>`;
  return {html: head + step2 + step3 + undoCard, after: bindUpload};
}
function bindUpload(){
  const U = UI.U, O = UI.UP, rerender = () => { const y = scrollY; render(); scrollTo(0, y); };
  $('#uMonth').onchange = e => { O.month = e.target.value; if (U) U.links = {}; rerender(); };
  $$('input[name=ufield]').forEach(r => r.onchange = () => { O.field = r.value; rerender(); });
  $('#uFile').onchange = e => { const f = e.target.files[0]; if (f) loadUploadFile(f); };
  const dz = $('#uDrop');
  ['dragenter','dragover'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.add('on'); }));
  ['dragleave','drop'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.remove('on'); }));
  dz.addEventListener('drop', e => { const f = e.dataTransfer && e.dataTransfer.files[0]; if (f) loadUploadFile(f); });
  const sh = $('#uShow'); if (sh) sh.onclick = () => { UI.month = S.undo.month; saveUI(); setTab('month'); };
  const ud = $('#uUndo'); if (ud) ud.onclick = undoUpload;
  if (!U) return;
  const keepOpen = () => { const o = $$('details.raw').map(d => d.open); return () => $$('details.raw').forEach((d, i) => { if (o[i] !== undefined) d.open = o[i]; }); };
  const redo = () => { const restore = keepOpen(); rerender(); restore(); };
  const sheet = $('#uSheet');
  if (sheet) sheet.onchange = e => { U.sheet = e.target.value; const d = upDetect(upAoa(U)); U.hdr = d.hdr; U.map = d.map; U.links = {}; rerender(); };
  $('#uHdr').onchange = e => { const h = Math.max(1, Math.min(upAoa(U).length, +e.target.value || 1)) - 1; U.hdr = h; U.map = upColsAt(upAoa(U), h); U.links = {}; rerender(); };
  $$('[data-col]').forEach(s => s.onchange = () => { U.map[s.dataset.col] = +s.value; U.links = {}; rerender(); });
  $$('[data-link]').forEach(s => { s.value = s.dataset.sel; s.onchange = () => { U.links[s.dataset.link] = s.value; redo(); }; });
  const z = $('#uZero'); if (z) z.onchange = () => { O.zero = z.checked; redo(); };
  const dt = $('#uDates'); if (dt) dt.onchange = () => { O.dates = dt.value; redo(); };
  const nc = $('#uNewCat'); if (nc) nc.onchange = () => { O.newCat = nc.value; redo(); };
  const ap = $('#uApply'); if (ap) ap.onclick = applyUpload;
  $('#uClear').onclick = () => { UI.U = null; rerender(); };
}

/* ---------- 렌더 ---------- */
const VIEWS = {live: viewLive, dash: viewDash, month: viewMonth, trend: viewTrend, entry: viewEntry, upload: viewUpload, master: viewMaster, check: viewCheck};
function render(){
  renderTabs(); renderConn(); hideTip();
  const v = VIEWS[UI.tab]();
  $('#view').innerHTML = `<div role="tabpanel" aria-labelledby="tab-${UI.tab}">${importBar()}${v.html}</div>`;
  bindImportBar();
  v.after && v.after();
}
function importBar(){ // 마지막 엑셀 반영 기준 시각 + 새 상품 확인
  const L = S.lastImport;
  if (!L || !['live','dash','month','trend'].includes(UI.tab)) return '';
  const pend = SY.token || !SYNC.remote ? (L.pending || []) : [], sm = L.sum || {}; // 새 상품 확인은 저장 권한이 있는 곳에서만
  const cats = [...new Set((S.cats || []).concat(['미분류']))];
  const pendHtml = pend.length ? `<div style="margin-top:12px;border-top:1px solid var(--line);padding-top:12px">
      <div class="note w" style="margin-bottom:10px">월간 표에 없는 상품이 파일에 ${pend.length}개 있습니다. 관리할 상품만 체크해 추가하세요. 체크하지 않은 상품은 다음 업로드부터 묻지 않습니다.</div>
      <div class="tw"><table><thead><tr><th style="width:36px"><span class="sr">추가</span></th><th>상품명</th><th>구분</th><th class="r">재고</th><th>소비기한</th></tr></thead><tbody>
      ${pend.map((p, i) => `<tr><td><input type="checkbox" class="chk1" data-pend="${i}" aria-label="${esc(p.name)} 추가" checked></td><td class="nm">${esc(p.name)}</td>
        <td><select class="cell" data-pcat="${i}">${cats.map(c => `<option ${c === (p.catSel || p.cat) ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></td>
        <td class="r num">${fmt(p.qty)}</td><td class="num">${dot(p.exp)}</td></tr>`).join('')}</tbody></table></div>
      <div class="bar" style="margin:10px 0 0"><button class="btn pri" id="pendAdd">체크한 상품 추가</button><button class="btn" id="pendNone">모두 추가 안 함</button></div></div>` : '';
  return `<div class="card ibar" style="margin-bottom:16px"><div class="bar" style="margin:0">
    <div style="min-width:0"><b>이지어드민 재고 ${dot(L.date)}${L.time ? ' ' + L.time : ''} 기준</b> <span class="muted">· ${mLabel(L.month)} ${L.field === 'biz' ? '사업단' : '지브레인'} 재고에 반영</span>
      <p class="sub">${L.carry ? `${L.carry.field === 'biz' ? '사업단' : '지브레인'} 재고는 ${mLabel(L.carry.month)} 값을 이어받음 · ` : ''}변경 ${sm.chg || 0} · 동일 ${sm.same || 0}${sm.add ? ` · 신규 ${sm.add}` : ''}${sm.zero ? ` · 파일에 없어 0 처리 ${sm.zero}` : ''}${sm.neg ? ` · 마이너스→0 ${sm.neg}` : ''}${L.guess ? ` <span class="flag">이름이 달라 추정 연결 ${L.guess}</span>` : ''}${L.ambig ? ` <span class="flag">직접 선택 필요 ${L.ambig}</span>` : ''}</p></div>
    <span class="sp"></span><button class="btn" data-tab="upload">연결 확인·수정</button></div>${pendHtml}</div>`;
}
function bindImportBar(){
  const L = S.lastImport, a = $('#pendAdd'); if (!a || !L) return;
  $$('[data-pcat]').forEach(s => s.onchange = () => { L.pending[+s.dataset.pcat].catSel = s.value; });
  a.onclick = () => addPending(new Set($$('[data-pend]').filter(c => c.checked).map(c => +c.dataset.pend)));
  $('#pendNone').onclick = () => addPending(new Set());
}
function setTab(t){ UI.tab = t; UI.confirm = ''; saveUI(); try { history.replaceState(null, '', '#' + t); } catch(e){} render(); scrollTo(0, 0); }

document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab]'); if (t){ setTab(t.dataset.tab); return; }
  const md = e.target.closest('[data-mode]'); if (md){ UI.mode = md.dataset.mode; saveUI(); render(); return; }
  const so = e.target.closest('[data-sort]'); if (so){ const k = so.dataset.sort; UI.sort = {k, dir: UI.sort.k === k ? -UI.sort.dir : 1}; render(); return; }
  const gs = e.target.closest('[data-go-status]'); if (gs){ UI.fSt = gs.dataset.goStatus; UI.fCat = ''; UI.q = ''; setTab('month'); return; }
  const pr = e.target.closest('[data-prio]'); if (pr){ UI.prio = pr.dataset.prio; render(); return; }
  const ed = e.target.closest('[data-edit]'); if (ed){ loadEntry(+ed.dataset.edit); UI.confirm = ''; setTab('entry'); return; }
  const ld = e.target.closest('[data-load]'); if (ld){ loadEntry(+ld.dataset.load); UI.confirm = ''; render(); return; }
  const fx = e.target.closest('[data-fix]'); if (fx){ const [m, id] = fx.dataset.fix.split('|'); UI.month = m; loadEntry(+id); saveUI(); setTab('entry'); return; }
});
document.addEventListener('change', e => {
  const id = e.target.id;
  if (id === 'selMonth'){ UI.month = e.target.value; UI.E = null; saveUI(); render(); }
  else if (id === 'fCat'){ UI.fCat = e.target.value; render(); }
  else if (id === 'fSt'){ UI.fSt = e.target.value; render(); }
  else if (id === 'tCat'){ UI.tCat = e.target.value; UI.tKey = ''; render(); }
  else if (id === 'tKey'){ UI.tKey = e.target.value; render(); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'fq'){ UI.q = e.target.value; const pos = e.target.selectionStart; render(); const f = $('#fq'); f.focus(); f.setSelectionRange(pos, pos); }
});
let rzT; let lastW = innerWidth;
window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(() => { if (innerWidth !== lastW){ lastW = innerWidth; if ($('.chart')) render(); } }, 200); });
window.addEventListener('hashchange', () => { const h = location.hash.replace('#',''); if (VIEWS[h] && h !== UI.tab){ UI.tab = h; render(); } });

$('#qFile').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) quickUpload(f); };
let dragN = 0;
const isFileDrag = e => e.dataTransfer && [...(e.dataTransfer.types || [])].includes('Files');
document.addEventListener('dragenter', e => { if (!isFileDrag(e) || UI.tab === 'upload') return; dragN++; document.body.classList.add('dragging'); });
document.addEventListener('dragleave', e => { if (!isFileDrag(e)) return; if (--dragN <= 0){ dragN = 0; document.body.classList.remove('dragging'); } });
document.addEventListener('dragover', e => { if (isFileDrag(e)) e.preventDefault(); });
document.addEventListener('drop', e => {
  dragN = 0; document.body.classList.remove('dragging');
  if (!isFileDrag(e) || e.target.closest && e.target.closest('#uDrop')) return; // 업로드 탭의 상자는 자체 처리
  e.preventDefault(); const f = e.dataTransfer.files[0]; if (!f) return;
  if (UI.tab === 'upload') loadUploadFile(f); else quickUpload(f); // 업로드 탭에서는 미리보기부터
});

render();
persist();
syncPull();
setInterval(() => { if (!document.hidden) syncPull(); }, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) syncPull(); });
</script>
